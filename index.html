<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e8">
  <title>Расписание занятий</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Расписание занятий</h1>
      <div class="week-controls"><button id="prevWeek" aria-label="Предыдущая неделя">←</button><button id="weekTitle" title="Нажмите, чтобы вернуться к текущей неделе">Эта неделя</button><button id="nextWeek" aria-label="Следующая неделя">→</button></div>
    </header>
    <div class="table-wrap"><table class="schedule" aria-label="Расписание занятий на пять дней"><thead><tr id="dayHeaders"><th class="number-head">№</th></tr></thead><tbody id="scheduleBody"></tbody></table></div>
    <section class="homework" id="tasksPanel" hidden><div class="homework-title"><h2>Задания</h2><button id="tasksToggle" aria-expanded="false">Скрыть</button></div><div id="taskContent"></div></section>
    <button id="showTasks" class="show-tasks" aria-expanded="false"><span aria-hidden="true">✎</span> Задания <span id="taskBadge" hidden></span></button>
  </main>
  <script src="app.js"></script>
</body>
</html>
