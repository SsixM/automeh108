<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f0">
  <meta name="description" content="Учебный дневник группы 108М КГАМТ: расписание, оценки, домашние задания, дежурства и замены.">
  <title>108М · учебный дневник</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Перейти к содержимому</a>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#schedule" aria-label="108М, на главную">
        <span class="brand-mark" aria-hidden="true">108</span>
        <span class="brand-text">
          <strong>учебный дневник</strong>
          <small>КГАМТ · группа 108М</small>
        </span>
      </a>
      <span id="syncStatus" class="sync-status" data-state="loading">
        <span class="sync-dot" aria-hidden="true"></span>
        <span id="syncText">загружаем данные…</span>
      </span>
      <button id="refreshButton" class="icon-button" type="button" aria-label="Обновить данные" title="Обновить данные">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
      </button>
    </header>

    <nav class="app-nav" aria-label="Разделы дневника">
      <button type="button" class="nav-item" data-view="schedule">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M8 17h6"/></svg>
        <span>Расписание</span>
      </button>
      <button type="button" class="nav-item" data-view="grades">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Оценки</span>
      </button>
      <button type="button" class="nav-item" data-view="tasks">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></svg>
        <span>ДЗ</span>
      </button>
      <button type="button" class="nav-item" data-view="duties">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3l2.1 5.3L19.5 10l-5.4 1.7L12 17l-2.1-5.3L4.5 10l5.4-1.7L12 3Z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg>
        <span>Дежурства</span>
      </button>
      <button type="button" class="nav-item" data-view="replacements">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h11l-3-3M20 17H9l3 3"/><path d="M15 7l-3 3M9 17l3-3"/></svg>
        <span>Замены</span>
      </button>
    </nav>

    <section class="page-head" aria-labelledby="pageTitle">
      <p class="eyebrow" id="pageEyebrow">КГАМТ · 2026/2027</p>
      <div class="page-head-row">
        <div>
          <h1 id="pageTitle">Расписание</h1>
          <p id="pageIntro" class="page-intro">Пары, кабинеты и замены на неделю.</p>
        </div>
        <div id="pageBadges" class="page-badges" aria-label="Сведения о данных"></div>
      </div>
    </section>

    <main id="view" class="main-content" tabindex="-1"></main>

    <footer class="footer">
      <p>Данные публикует Telegram-бот. Оценки и ФИО видны всем, у кого есть ссылка на сайт.</p>
      <p id="footerStamp" class="footer-stamp"></p>
    </footer>
  </div>

  <div id="liveRegion" class="visually-hidden" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">Для работы дневника нужен JavaScript. Включите его и обновите страницу.</div>
  </noscript>

  <script src="app.js" defer></script>
</body>
</html>
